    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e6f4ea" />
    <script>
      try {
        var t = localStorage.getItem('ecopulse_theme_v1');
        var d = (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', d);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', d === 'dark' ? '#08140d' : '#e6f4ea');
      } catch (e) {}
    </script>
    <meta name="description" content="EcoPulse - Smart Energy Saving Reminder. Build sustainable energy-saving habits with timely reminders, estimated savings, and analytics." />
