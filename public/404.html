  <!-- Tiny inline route redirector: converts real-path misses for known routes into hash routes -->

    (function () {
      try {
        var path = window.location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
        var first = path.split('/')[0];
        var known = ['dashboard', 'reminders', 'calculator', 'analytics', 'learn', 'settings'];
        if (known.indexOf(first) !== -1) {
          var target = '/#/' + path + (window.location.search || '') + (window.location.hash || '');
          window.location.replace(target);
        }

        /* Fallback: render 404 page content */
